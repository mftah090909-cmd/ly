name: New Era Chat APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract ZIP
        id: extract
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -type f | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir project
          unzip -q "$ZIP" -d project

          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          VERSION=8.7
          PROP="$ROOT/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$PROP" ]; then
            FOUND=$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*zip.*/\1/p' "$PROP" | head -n 1)
            if [ -n "$FOUND" ]; then VERSION="$FOUND"; fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.extract.outputs.version }}
          cache-disabled: true

      - name: Build APK
        run: |
          cd "${{ steps.extract.outputs.root }}"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New-Era-Chat-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
